<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线路介绍</title>
<style>*{box-sizing:border-box}body{margin:0;background:#12151a;color:#f5f5f5;font-family:"Microsoft YaHei",sans-serif}.wrap{max-width:920px;margin:0 auto;padding:24px}.back{color:#ddd;text-decoration:none;display:inline-block;margin-bottom:18px}.hero{border:1px solid #3b4048;border-radius:16px;padding:24px;background:#1b1f25}.kicker{display:flex;align-items:center;gap:10px;color:#bfc4cc}.swatch{width:18px;height:18px;border-radius:50%}h1{font-size:clamp(28px,5vw,48px);margin:12px 0 10px}.lead{font-size:17px;line-height:1.8;color:#dfe2e6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.card{background:#161a1f;border:1px solid #333943;border-radius:12px;padding:15px}.card b{display:block;margin-bottom:7px}.card p{margin:0;color:#bfc4cc;line-height:1.6;font-size:14px}.edit{margin-top:18px;padding:15px;border-radius:10px;background:#232830;color:#cdd2d9;line-height:1.7;font-size:14px}@media(max-width:640px){.wrap{padding:14px}.hero{padding:18px}.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><a class="back" href="index.html">← 返回互动地图</a><section class="hero"><div class="kicker"><span class="swatch" id="swatch"></span><span>线路介绍页面</span></div><h1 id="name">线路</h1><p class="lead" id="intro"></p><div class="grid"><div class="card"><b>线路编号</b><p id="code"></p></div><div class="card"><b>地图识别</b><p>页面颜色与 PSD 图例及线路图层保持对应。</p></div><div class="card"><b>页面扩展</b><p>可继续加入首末班车、车站列表、沿线景点、票价或图文介绍。</p></div></div><div class="edit">当前为可直接使用的线路介绍页模板。正式上线时，只需在 <code>data.js</code> 或本页面脚本中替换介绍文字即可，不需要改动地图交互结构。</div></section></main>
<script src="data.js"></script><script>(()=>{const q=new URLSearchParams(location.search),id=q.get('id'),r=window.MAP_DATA.routes.find(x=>x.id===id)||window.MAP_DATA.routes[0];document.title=r.name+'｜线路介绍';document.getElementById('name').textContent=r.name;document.getElementById('code').textContent=r.id;document.getElementById('swatch').style.background=r.color;document.getElementById('intro').textContent=r.name+'是本专题地图中的一条轨道交通线路。该页面已与地图中的线路热点建立跳转关系，可在此继续补充线路概况、开通信息、起讫站、换乘站以及沿线景点等正式内容。';})();</script></body></html>
